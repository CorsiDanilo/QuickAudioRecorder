name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build executable
        run: pyinstaller --noconsole --onefile --icon=app_icon.ico --add-data "app_icon.ico;." --name QuickAudioRecorder main.py

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "dist\QuickAudioRecorder.exe")) {
            throw "dist\QuickAudioRecorder.exe was not created"
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickAudioRecorder-windows
          path: dist/QuickAudioRecorder.exe

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickAudioRecorder.exe
